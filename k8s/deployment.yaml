
apiVersion: apps/v1
kind: Deployment
metadata:
  name: careplus-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: careplus
  template:
    metadata:
      labels:
        app: careplus
    spec:
      containers:
        - name: careplus
          image: ghcr.io/sheshasai007/careplus:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: careplus-db-secret
                  key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: careplus-service
spec:
  type: NodePort
  selector:
    app: careplus
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
