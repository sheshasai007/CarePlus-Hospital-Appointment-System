
name: CarePlus CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get CarePlus Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Check JavaScript Syntax
        run: node --check server.js

      - name: Start CarePlus Server
        run: |
          node server.js &
          sleep 10

      - name: Run Selenium Test
        run: npm test

      - name: Build Docker Image
        run: docker build -t careplus:latest .
