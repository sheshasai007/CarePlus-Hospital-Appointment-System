name: CarePlus CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: careplus_test_password
      DB_NAME: careplus
      MYSQL_ROOT_PASSWORD: careplus_test_password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: careplus_test_password
          MYSQL_DATABASE: careplus
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pcareplus_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Get CarePlus Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Check JavaScript Syntax
        run: node --check server.js

      - name: Create CarePlus Test Tables
        run: |
          mysql -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" careplus <<'SQL'
          CREATE TABLE IF NOT EXISTS patients (
            patient_id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            name VARCHAR(100),
            email VARCHAR(100) UNIQUE,
            phone VARCHAR(10),
            password VARCHAR(255)
          );

          CREATE TABLE IF NOT EXISTS doctors (
            doctor_id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            name VARCHAR(100),
            specialization VARCHAR(100),
            experience INT,
            fee DECIMAL(10,2)
          );

          CREATE TABLE IF NOT EXISTS appointments (
            appointment_id INT NOT NULL AUTO_INCREMENT PRIMARY KEY,
            patient_id INT,
            doctor_id INT,
            appointment_date DATE,
            appointment_time VARCHAR(20),
            reason VARCHAR(255),
            status VARCHAR(30) DEFAULT 'Booked'
          );

          INSERT INTO doctors
            (doctor_id, name, specialization, experience, fee)
          VALUES
            (1, 'Dr. Ravi Kumar', 'Cardiology', 12, 700.00),
            (2, 'Dr. Priya Sharma', 'Dermatology', 8, 500.00),
            (3, 'Dr. Kumar Rao', 'Neurology', 10, 800.00),
            (4, 'Dr. Sneha Reddy', 'Dentistry', 6, 400.00)
          ON DUPLICATE KEY UPDATE
            name = VALUES(name),
            specialization = VALUES(specialization),
            experience = VALUES(experience),
            fee = VALUES(fee);
          SQL

      - name: Start CarePlus Server
        run: |
          node server.js &
          sleep 10
          curl --fail http://localhost:3000/

      - name: Run Selenium Tests
        run: npm test

      - name: Login to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/sheshasai007/careplus:latest